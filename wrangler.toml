name = "techfusion-api"
main = "src/index.js"
compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding = "CONTENT_KV"
id = "217f548642464439afa2b966a585e486"

[[kv_namespaces]]
binding = "AGENT_STATE"
id = "4f99c86f158e4d3cbd1798e453117759"

[[kv_namespaces]]
binding = "ANALYTICS"
id = "436e3d18ff4a4ac8bdddfd8271b2f2c9"

[[queues.producers]]
queue = "enhancement-queue"
binding = "ENHANCEMENT_QUEUE"

[[queues.consumers]]
queue = "enhancement-queue"
max_batch_size = 1
max_batch_timeout = 30

[[queues.producers]]
queue = "publishing-queue"
binding = "PUBLISHING_QUEUE"

[[queues.consumers]]
queue = "publishing-queue"
max_batch_size = 1
max_batch_timeout = 30

[vars]
NOTION_DATABASE_ID = "1fbbd080de92804389aadc02853c15c7"
# Central LLM routing. If OmniRoute auth is enabled, store the credential in
# CONTENT_KV's `secrets` object as `omniroute_api_key`; never commit it here.
OMNIROUTE_ENABLED = "true"
OMNIROUTE_BASE_URL = "https://omniroute.techfusionreport.com"
OMNIROUTE_CHAIN = "TFR Free Chain"
OMNIROUTE_TIMEOUT_MS = "30000"
OMNIROUTE_FALLBACK_ENABLED = "true"
# Cloudflare Access for the /ops dashboard API. Fill both in AFTER creating the
# Access application for techfusionreport.com/ops (see docs spec §4.2):
#   ACCESS_TEAM_DOMAIN — your team subdomain only, e.g. "techfusion"
#                        (→ https://techfusion.cloudflareaccess.com)
#   ACCESS_AUD         — the Access application's AUD tag (Application audience)
# Both are non-secret. While empty, /ops/api/* returns 500 "Access not configured".
ACCESS_TEAM_DOMAIN = "jsmithhomelab"
ACCESS_AUD = "237b90bc3ae13f3d86ea609fc2c902b2801e130eb338f105a6b66bb3e90ba032"

[triggers]
crons = ["0 */6 * * *", "0 9 * * 1", "0 2 1 * *", "*/30 * * * *"]
