name: Validate PR metadata

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr-metadata:
    name: Require PR metadata footer
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body metadata
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys

          with open(os.environ["EVENT_PATH"], encoding="utf-8") as event_file:
              event = json.load(event_file)

          body = event.get("pull_request", {}).get("body") or ""
          required_fields = ("Agent", "Task", "Risk")
          missing = [
              field
              for field in required_fields
              if not re.search(rf"(?m)^\s*(?:\*\*)?{re.escape(field)}:(?:\*\*)?\s*(?!<)\S+", body)
          ]

          if missing:
              print("Missing required PR metadata field(s): " + ", ".join(missing))
              print("Add Agent:, Task:, and Risk: entries to the PR body footer with real values (not the template placeholder).")
              sys.exit(1)

          print("Required PR metadata fields are present.")
          PY
